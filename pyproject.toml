[project]
name = "apa-travel-backend"
version = "0.1.0"
description = "APA Insurance travel request and approval backend"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40,<2",
    "django>=5.2,<5.3",
    "python-dotenv>=1.1,<2",
    "whitenoise>=6.9,<7",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.14,<0.15",
]

# Keep application code readable and formatting reproducible.
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["travel/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["config", "travel"]
